# https://docs.devin.ai/onboard-devin/environment-yaml
# Commands run from the repo root.

# One-time setup (install system-level dependencies).
initialize: |
  # Node.js 18+ is required; already available on the VM.
  # Install native build tools needed for sqlite3 native addon.
  sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3

# Install project dependencies (runs every session).
maintenance: |
  cd backend && cp -n .env.example .env && sed -i 's|FRONTEND_URL=http://localhost:3000|FRONTEND_URL=http://localhost:5173|' .env && npm install
  cd frontend && cp -n .env.example .env && npm install

# Reference info for the agent.
knowledge:
  - name: lint
    contents: |
      cd frontend && npm run lint
  - name: test
    contents: |
      cd backend && npm test
  - name: build
    contents: |
      cd frontend && npm run build
  - name: run
    contents: |
      # Start backend (port 3001) and frontend (port 5173):
      cd backend && npm run dev &
      cd frontend && npm run dev &
  - name: tech-stack
    contents: |
      Backend: Node.js + Express + SQLite (in-memory) + Jest tests (161 tests)
      Frontend: React 19 + TypeScript + Vite + Material UI
      Auth: email-only JWT (no password)
