# https://docs.devin.ai/onboard-devin/environment-yaml
# Commands run from the repo root.

# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  # Node.js 18+ is required (pre-installed on this VM)

# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  cd backend && cp -n .env.example .env && sed -i 's|FRONTEND_URL=http://localhost:3000|FRONTEND_URL=http://localhost:5173|' .env && npm install
  cd frontend && cp -n .env.example .env && npm install

# Reference info for agent
knowledge:
  - name: lint
    contents: |
      cd frontend && npm run lint
  - name: test
    contents: |
      cd backend && npm test
  - name: build
    contents: |
      cd frontend && npm run build
  - name: dev-servers
    contents: |
      # Start backend: cd backend && npm run dev (runs on port 3001)
      # Start frontend: cd frontend && npm run dev (runs on port 5173)
      # Login with any email (no password required)
  - name: project-structure
    contents: |
      Full-stack app: Node.js/Express backend with SQLite in-memory DB, React/TypeScript/Vite frontend.
      Backend tests: 161 tests across 8 suites (jest). Run with: cd backend && npm test
      Frontend build: cd frontend && npm run build (tsc + vite build)
