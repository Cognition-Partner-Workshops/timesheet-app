# https://docs.devin.ai/onboard-devin/repo-setup
# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  # Create backend .env from example if it doesn't exist
  if [ ! -f backend/.env ]; then
    cp backend/.env.example backend/.env
  fi
  # Create frontend .env from example if it doesn't exist
  if [ ! -f frontend/.env ]; then
    cp frontend/.env.example frontend/.env
  fi
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  (cd frontend && npm install)
  (cd backend && npm install)
knowledge:
  - name: lint
    contents: |
      (cd frontend && npm run lint)
  - name: test
    contents: |
      # Backend tests
      (cd backend && npm test)
      # Frontend tests
      (cd frontend && npm test)
  - name: build
    contents: |
      (cd frontend && npm run build)
  - name: dev-servers
    contents: |
      # Start backend dev server (port 3001)
      (cd backend && npm run dev)
      # Start frontend dev server (port 5173)
      (cd frontend && npm run dev)
