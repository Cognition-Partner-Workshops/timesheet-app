name: TimesheetApp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  TimesheetApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: ai.cognition.workshops.timesheet
    sources:
      - path: TimesheetApp
    settings:
      base:
        INFOPLIST_FILE: TimesheetApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ai.cognition.workshops.timesheet
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - TimesheetAppTests
  TimesheetAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: ai.cognition.workshops.timesheet.tests
    sources:
      - path: TimesheetAppTests
    dependencies:
      - target: TimesheetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cognition.workshops.timesheet.tests
        GENERATE_INFOPLIST_FILE: YES
